services:
  image-service:
    build:
      context: .
      dockerfile: image-service/Dockerfile
    expose:
      - "8080"
  journey-service:
    build:
      context: .
      dockerfile: journey-service/Dockerfile
    expose:
      - "8080"
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    expose:
      - "3000"
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - image-service
      - journey-service
