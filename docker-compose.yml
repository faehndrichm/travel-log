services:
  image-service:
    build:
      context: .
      dockerfile: image-service/Dockerfile
    expose:
      - "80"

  journey-service:
    build:
      context: .
      dockerfile: journey-service/Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - image-service
      - journey-service
