services:
  journey-service:
    build:
      context: .
      dockerfile: journey-service/Dockerfile
    expose:
      - "8080"
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: dev
    ports:
        - "3000:3000"
    volumes:
      - ./ui:/app # for dev only
    environment:
      PUBLIC_API_BASE: http://localhost:8080

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - journey-service

